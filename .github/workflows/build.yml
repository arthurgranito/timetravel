name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build IPA (sem assinatura)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnóstico do Xcode
        run: |
          xcodebuild -version
          echo "Xcodes disponíveis:"
          ls /Applications | grep Xcode || true
          xcrun --sdk iphoneos --show-sdk-version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Build Release (iphoneos, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project TimeRewind.xcodeproj -scheme TimeRewind -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Empacotar IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/TimeRewind.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App não encontrado em $APP_PATH"
            ls -la build/Build/Products/Release-iphoneos || true
            exit 1
          fi
          rm -rf Payload TimeRewind.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TimeRewind.ipa Payload
          ls -lh TimeRewind.ipa
          echo "### IPA gerado: TimeRewind-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TimeRewind-${{ github.run_number }}
          path: TimeRewind.ipa
          if-no-files-found: error

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Resumo de erros
        if: failure()
        run: |
          {
            echo "## Erros de compilação"
            echo '```'
            if [ -f build.log ]; then
              grep -n "error:" build.log | head -50 || echo "Nenhuma linha com 'error:' encontrada no build.log."
            else
              echo "build.log não existe (a falha aconteceu antes do xcodebuild)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Testes unitários (simulador)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnóstico do Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep Xcode || true

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Rodar testes
        run: |
          set -o pipefail
          UDID=$(python3 scripts/pick_simulator.py "Pro")
          xcodebuild test -project TimeRewind.xcodeproj -scheme TimeRewind -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      - name: Upload test.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ github.run_number }}
          path: test.log
          if-no-files-found: ignore

      - name: Resumo de falhas
        if: failure()
        run: |
          {
            echo "## Falhas nos testes / compilação"
            echo '```'
            if [ -f test.log ]; then
              grep -nE "error:|failed|FAILED" test.log | head -80 || echo "Nenhuma linha de erro encontrada no test.log."
            else
              echo "test.log não existe (a falha aconteceu antes do xcodebuild test)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  screenshots:
    name: Screenshots (simulador)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Build para simulador
        run: |
          set -o pipefail
          xcodebuild -project TimeRewind.xcodeproj -scheme TimeRewind -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build | tee screenshots-build.log

      - name: Prints no iPhone grande
        run: |
          UDID=$(python3 scripts/pick_simulator.py "Pro")
          scripts/take_screenshots.sh "$UDID" "iphone-pro" build-sim/Build/Products/Debug-iphonesimulator/TimeRewind.app screenshots

      - name: Prints no iPhone SE (se disponível)
        continue-on-error: true
        run: |
          if UDID=$(python3 scripts/pick_simulator.py "SE" --strict --create); then
            scripts/take_screenshots.sh "$UDID" "iphone-se" build-sim/Build/Products/Debug-iphonesimulator/TimeRewind.app screenshots
          else
            echo "Nenhum simulador de iPhone SE neste runner; pulando." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Listar prints
        if: always()
        run: |
          {
            echo "## Screenshots"
            ls -1 screenshots 2>/dev/null | sed 's/^/- /' || echo "Nenhum print gerado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots
          if-no-files-found: warn

      - name: Upload log do build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-build-log-${{ github.run_number }}
          path: screenshots-build.log
          if-no-files-found: ignore

      - name: Resumo de erros
        if: failure()
        run: |
          {
            echo "## Erros no job de screenshots"
            echo '```'
            if [ -f screenshots-build.log ]; then
              grep -n "error:" screenshots-build.log | head -50 || echo "Nenhuma linha com 'error:' no log do build."
            else
              echo "Log do build não existe (a falha aconteceu antes do xcodebuild)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
